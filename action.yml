name: Brandrails
description: Regenerate AI rules files from a DTCG tokens.json and flag design-token drift in pull requests.
author: Matej Holek
branding:
  icon: layers
  color: purple

inputs:
  command:
    description: "What to run: `check` (drift check) or `generate` (write rules files)."
    required: false
    default: check
  tokens:
    description: Path to the DTCG tokens file.
    required: false
    default: tokens.json
  ignore:
    description: Extra globs for `check` to skip, space-separated (build output is always skipped).
    required: false
    default: ""
  base:
    description: Base ref to diff against for `check`.
    required: false
    default: ${{ github.base_ref }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build
    - shell: bash
      env:
        BR_COMMAND: ${{ inputs.command }}
        BR_TOKENS: ${{ inputs.tokens }}
        BR_BASE: ${{ inputs.base }}
        BR_IGNORE: ${{ inputs.ignore }}
      run: |
        set -f
        args=(--tokens "$BR_TOKENS")
        if [ "$BR_COMMAND" = check ]; then
          args+=(--base "${BR_BASE:-main}")
          for g in $BR_IGNORE; do args+=(--ignore "$g"); done
        fi
        node "${{ github.action_path }}/bin/brandrails.js" "$BR_COMMAND" "${args[@]}"
